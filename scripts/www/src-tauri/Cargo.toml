[package]
name = "car-expense-tracker"
version = "1.5.0"
authors = ["CarExpenseTracker"]
edition = "2021"
description = "汽车费用追踪应用"
license = "MIT"
repository = ""
default-run = "car-expense-tracker"

# 构建目标（Android）
[[build.targets]]
triple = "aarch64-linux-android"

[[build.targets]]
triple = "armv7-linux-androideabi"

[[build.targets]]
triple = "i686-linux-android"

[[build.targets]]
triple = "x86_64-linux-android"

[features]
default = ["custom-protocol"]

[dependencies]
tauri = { version = "1.5", features = ["shell-open", "dialog-all", "fs-all"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.21"
calamine = "0.22"
chrono = "0.4"
thiserror = "1.0"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }